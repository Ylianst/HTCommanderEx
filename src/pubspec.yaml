name: htcommander
description: "Multi-platform tool for the UV-Pro, GA-5WB, VR-N76, VR-N7500 HAM radios. Allows for easy control over your radio."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.68+70

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.2
  file_picker: ^11.0.2
  shared_preferences: ^2.2.3
  flutter_blue_plus: ^1.35.2
  permission_handler: ^13.0.1
  path_provider: ^2.1.4
  crypto: ^3.0.0
  # OS-native encrypted storage for secrets (RepeaterBook token): Keychain
  # (iOS/macOS), Keystore/EncryptedSharedPreferences (Android), DPAPI (Windows),
  # libsecret (Linux). Mirrors the C# ISecretStore approach.
  flutter_secure_storage: ^10.3.1
  es_compression: ^2.0.13
  http: ^1.6.0
  # GBK/GB2312 codec: the radio stores channel and region names in GBK (code
  # page 936), not UTF-8, so Chinese names round-trip with the vendor app.
  fast_gbk: ^1.0.0
  flutter_pcm_sound: ^3.1.6
  audioplayers: ^6.7.1
  intl: ^0.20.2
  desktop_drop: ^0.7.1
  libserialport: ^0.3.0+1
  ffi: ^2.0.0
  flutter_tts: ^4.2.5
  record: ^7.1.1
  sherpa_onnx: ^1.13.3
  archive: ^4.0.9
  pasteboard: ^0.5.0
  desktop_updater: ^2.4.2
  package_info_plus: ^9.0.1
  grpc: ^5.1.0
  mqtt_client: ^10.9.0
  satellite_observer: ^1.0.1
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.0
  flutter_local_notifications: ^22.3.0
  connectivity_plus: ^7.3.1
  # Firebase Cloud Messaging: lets the app register with HTCloudServer
  # (aprs.meshcentral.com) and receive pushed APRS messages on Android/iOS.
  # Each mobile platform requires its Firebase configuration file.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Cross-platform (web + dart:io) WebSocket client. On the web build served by
  # the desktop app, the Flutter UI connects back to the host over this to share
  # the host's radio via the existing /websocket.aspx bridge, instead of using
  # the browser's Web Bluetooth. See lib/radio/websocket_transport.dart.
  web_socket_channel: ^3.0.1

  # Web platform bindings (Web Audio API) used to play the desktop host's
  # mirrored audio in the browser. See lib/services/web/host_audio_player_web.dart.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Override sherpa_onnx Android platform packages with empty stubs to exclude
# the large native .so libraries from the Android APK. Speech-to-text is
# disabled on Android at runtime; these stubs prevent ~50 MB of unused native
# code from being bundled.
dependency_overrides:
  # Vendored, patched copy of desktop_drop: the upstream Windows plugin only
  # reads dropped files (CF_HDROP), so links dragged from a web browser were
  # never delivered. The patched Windows plugin also reads dropped text / URLs
  # (CFSTR_INETURLW / CF_UNICODETEXT), enabling drag-and-drop of a web page URL
  # onto a channel. See third_party/desktop_drop/windows/desktop_drop_plugin.cpp.
  desktop_drop:
    path: third_party/desktop_drop
  # Vendored, patched copy of flutter_tts: the upstream macOS plugin's
  # AVSpeechSynthesisVoiceQuality / AVSpeechSynthesisVoiceGender switches are
  # not exhaustive, producing Swift 6 warnings ("this is an error in the Swift 6
  # language mode"). The patched copy adds `@unknown default:` cases. See
  # third_party/flutter_tts/macos/Classes/FlutterTtsPlugin.swift.
  flutter_tts:
    path: third_party/flutter_tts
  # Pin path_provider_android to the last Pigeon-based release (2.2.23).
  # Version 2.3.0 switched its internal implementation to package:jni, which
  # transitively pulls in the `jni` native plugin. `jni` declares Linux platform
  # support and bundles a jni.h that declares the variadic JNI *V methods with
  # `void *` instead of `va_list`; on Linux (ARM64 / newer Clang) passing a real
  # `va_list` to that `void *` parameter is a hard compile error, breaking
  # `flutter build linux`. path_provider_android is Android-only, so pinning it
  # below 2.3.0 removes jni/jni_flutter from the dependency graph entirely with
  # no loss of functionality.
  path_provider_android: 2.2.23
  sherpa_onnx_android_arm64:
    path: sherpa_stubs/sherpa_onnx_android_arm64
  sherpa_onnx_android_armeabi:
    path: sherpa_stubs/sherpa_onnx_android_armeabi
  sherpa_onnx_android_x86:
    path: sherpa_stubs/sherpa_onnx_android_x86
  sherpa_onnx_android_x86_64:
    path: sherpa_stubs/sherpa_onnx_android_x86_64

flutter_launcher_icons:
  image_path: "assets/images/AppIcon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/AppIcon.png"
  windows:
    generate: true
    image_path: "assets/images/AppIcon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/AppIcon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate localization classes from the ARB files in lib/l10n (see
  # l10n.yaml). This produces AppLocalizations used throughout the app.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tabs/
    # Offline callsign -> country/DXCC-entity table (AD1C country-files.com),
    # gzip-compressed JSON loaded into memory at startup. See tools/build_cty.py.
    - assets/callsign/
    # Seed amateur-satellite data (Celestrak TLEs + SatNOGS transponder catalog)
    # so the satellite feature works offline on first run before an online
    # refresh. See lib/satellite/tle_repository.dart.
    - assets/satellites/
    # Mozilla CA root bundle (curl.se/docs/caextract.html). Trusted in addition
    # to the OS store when downloading callsign databases, so an outdated system
    # trust store doesn't break updates. See services/callsign_lookup_service.dart.
    - assets/certs/cacert.pem

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
